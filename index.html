:root{font-family:Inter,ui-sans-serif,system-ui,sans-serif;color:#142d49;background:#f2f5f9;font-synthesis:none}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer;border:0;border-radius:12px;padding:13px 18px;font-weight:700;background:#e8eef6;color:#143455;min-height:48px}button:hover{filter:brightness(.96)}button:disabled{opacity:.45;cursor:default}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #52b7eb;outline-offset:3px}header{background:#103b69;color:white;padding:24px max(22px,calc((100vw - 1120px)/2));display:flex;justify-content:space-between;align-items:center;gap:16px}.brand{display:flex;align-items:center;gap:14px}.ball{font-size:31px;background:#ffffff18;border-radius:14px;padding:10px}h1{font-size:22px;margin:0;letter-spacing:-.5px}.eyebrow{font-size:11px;letter-spacing:2px;font-weight:750;text-transform:uppercase;color:#8cb8df}header p{margin:5px 0 0;color:#bed3e8;font-size:13px}.local{font-size:12px;background:#ffffff12;padding:9px 12px;border-radius:30px}nav{display:flex;gap:7px;max-width:1120px;margin:22px auto;padding:0 22px}nav button{background:transparent;color:#58708a}nav button.active{background:white;color:#103b69;box-shadow:0 2px 8px #1938560c}main{max-width:1120px;margin:auto;padding:0 22px 48px}h2{font-size:27px;letter-spacing:-.7px;margin:0 0 8px}h3{font-size:18px;margin:0 0 16px}p{line-height:1.5}.muted{color:#65788e;font-size:14px}.panel{background:white;padding:24px;border-radius:20px;border:1px solid #e2e9f1;margin:20px 0}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:18px}label{display:block;font-size:13px;font-weight:650;margin-bottom:7px}input,select{width:100%;border:1px solid #cad5e2;border-radius:10px;padding:12px;background:white;color:#142d49;min-height:47px}input[type=checkbox]{width:20px;min-height:20px;accent-color:#1564a4}.primary{background:#155e9b;color:white}.danger{color:#b92b38;background:#fff0f1}.good{color:#167453;background:#e6f6ee}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.choices{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.choice{display:flex;align-items:center;gap:10px;padding:13px;background:#f5f7fa;border:1px solid #e0e7ef;border-radius:12px;margin:0;cursor:pointer}.choice:has(input:checked){border-color:#2673b3;background:#edf6ff}.num{font-weight:800;color:#18629c;font-size:14px}.section{margin-top:24px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:22px}.card{background:white;border:1px solid #e1e8f0;border-radius:18px;overflow:hidden}.cardtop{padding:20px;display:flex;align-items:center;gap:13px}.jersey{font-size:21px;font-weight:800;background:#edf4fb;border-radius:13px;width:50px;height:50px;display:grid;place-items:center;color:#17619c}.name{font-size:20px;font-weight:750}.counts{display:flex;gap:14px;margin-top:5px;font-size:13px;color:#63788e}.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;padding:0 16px 16px}.actions button{padding:15px 6px}.summary{display:flex;gap:24px;align-items:center}.metric strong{font-size:32px;display:block;line-height:1.1}.metric span{font-size:12px;color:#62768e}.badge{border-radius:20px;background:#e8f4ed;color:#19784c;font-size:12px;padding:7px 12px;font-weight:700}.empty{text-align:center;padding:55px 20px}.empty .icon{font-size:45px}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;font-size:14px}th,td{text-align:left;padding:13px 9px;border-bottom:1px solid #e8edf3;white-space:nowrap}th{font-size:12px;color:#65788e}td button{padding:7px 10px;min-height:36px;font-size:12px}footer{font-size:12px;color:#718298;text-align:center;padding:20px}dialog{border:0;border-radius:20px;padding:26px;width:min(520px,calc(100% - 28px));box-shadow:0 20px 80px #10284035}dialog::backdrop{background:#10284080}dialog h2{font-size:23px}.scoregrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.scoregrid input,.scoregrid select{font-size:28px;font-weight:750;text-align:center}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#143b60;color:white;padding:13px 22px;border-radius:12px;z-index:5;box-shadow:0 4px 20px #10284030}#toast:empty{display:none}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.small{font-size:13px;padding:10px 13px}.roster{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.rosteritem{background:#f5f7fa;padding:16px;border-radius:12px}.rosteritem .row{flex-wrap:nowrap}.rosteritem input:first-child{width:75px}a{color:#1564a4}@media(max-width:800px){.choices{grid-template-columns:repeat(3,1fr)}.cards{grid-template-columns:repeat(2,1fr)}.roster{grid-template-columns:repeat(2,1fr)}}@media(max-width:520px){header{padding:18px}.local{display:none}main{padding:0 14px 35px}nav{padding:0 14px;margin:15px auto;gap:3px}nav button{padding:12px 8px;font-size:12px;flex:1}.panel{padding:18px}.formgrid{grid-template-columns:1fr}.choices{grid-template-columns:repeat(2,1fr)}.cards{gap:10px}.cardtop{padding:15px 10px;gap:8px}.jersey{width:36px;height:40px;font-size:17px}.name{font-size:17px}.counts{gap:7px;font-size:11px}.actions{grid-template-columns:1fr;padding:0 10px 10px;gap:7px}.actions button{min-height:50px}.roster{grid-template-columns:1fr}h2{font-size:24px}.summary{gap:20px}}
 .quick-choice{display:flex;align-items:center;justify-content:center;gap:10px;border:3px solid transparent;border-radius:14px;min-height:100px;font-size:24px;font-weight:800;cursor:pointer;margin:0}.quick-choice input{width:20px;min-height:20px;accent-color:#155e9b}.quick-choice:has(input:checked){border-color:currentColor;box-shadow:0 0 0 3px #e8eef6}.quick-choice:focus-within{outline:3px solid #52b7eb;outline-offset:3px}[hidden]{display:none!important}.score-pick{width:100%;font-size:22px;background:#edf4fb;color:#155e9b;border:1px solid #cbdcec}.score-block{margin-top:12px;padding:12px 8px;background:#f4f7fb;border:1px solid #d7e2ee;border-radius:14px}.score-row{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:3px;margin:4px 0}.score-number{padding:0;min-height:42px;border-radius:7px;background:white;border:1px solid #dbe4ee;font-size:14px;font-weight:750}.score-number.selected{background:#155e9b;color:white;border-color:#155e9b}@media(max-width:520px){dialog{padding:18px}.score-number{font-size:12px}.score-block{padding:10px 5px}.score-row{gap:2px}}.opening-options{display:flex;gap:16px;justify-content:center;margin:28px auto 0;max-width:760px;flex-wrap:wrap}.opening-options button{font-size:20px;min-height:100px;flex:1;min-width:230px}.cards.service-court{grid-template-columns:repeat(3,minmax(0,1fr))}@media(max-width:520px){.service-court .cardtop{flex-direction:column;align-items:center;text-align:center;padding:12px 6px;gap:8px}.service-court .name{font-size:14px;overflow-wrap:anywhere}.service-court .jersey{width:38px;height:38px}.service-court .card button{min-height:112px!important}} .service-status{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;background:#e9f2fa;padding:16px;border-radius:14px}.service-options{margin:12px 0;font-size:13px;color:#58708a}.service-options summary{cursor:pointer}.card.current-server{border:3px solid #167453;box-shadow:0 0 0 2px #e6f6ee}.card.current-server .jersey{background:#e6f6ee;color:#167453}.badge.unfinished{background:#fff0d5;color:#8a5505}</style></head><body><header><div class="brand"><div class="ball" aria-hidden="true">◉</div><div><div class="eyebrow">VBC Interlaken</div><h1>Service Tracker</h1><p>Dein Team. Dein Satz. Dein Service.</p></div></div><div class="local">● Auf diesem Gerät gespeichert</div></header><nav aria-label="Hauptnavigation"><button data-tab="new">Neues Spiel</button><button data-tab="live">LIVE-Game</button><button data-tab="roster">Spielerinnen</button><button data-tab="archive">Archiv</button></nav><main id="app"></main><footer>VBC Interlaken · Asse & Servicefehler</footer><dialog id="modal"></dialog><div id="toast" class="toast" role="status" aria-live="polite"></div><script>
'use strict';
const KEY='vbci-service-simple-v1';const initial=[[11,'Kare'],[2,'Angie'],[3,'Svenia'],[4,'Masha'],[5,'Nicole'],[6,'Jill'],[10,'Jenni'],[9,'Lea'],[18,'Sina Libera'],[14,'Debbie'],[15,'Debby'],[8,'Alena']].map(([number,name],i)=>({id:'p'+i,number,name}));
let state={players:initial,games:[],active:null};try{const saved=JSON.parse(localStorage.getItem(KEY));if(saved&&Array.isArray(saved.players)&&Array.isArray(saved.games))state=saved}catch{}let archiveView=null;let viewSet=null;let tab=state.active?(state.games.find(g=>g.id===state.active)?.closed?'archive':'live'):'new',scope='set',draft={opponent:'',date:today(),kader:[],start:[]};const app=document.querySelector('#app'),modal=document.querySelector('#modal');let timer;
function today(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function uid(){return crypto.randomUUID()}function game(){return state.games.find(g=>g.id===state.active)}function player(id,g=game()){return g?.players.find(p=>p.id===id)||state.players.find(p=>p.id===id)}function save(){try{localStorage.setItem(KEY,JSON.stringify(state));return true}catch{toast('Speichern fehlgeschlagen. Bitte Daten exportieren.');return false}}function toast(s){document.querySelector('#toast').textContent=s;clearTimeout(timer);timer=setTimeout(()=>document.querySelector('#toast').textContent='',2600)}function close(){modal.close()}function show(html){modal.innerHTML=html;modal.showModal()}function displayedSet(g){return Math.min(viewSet||g.set,g.set)}function wins(g){return g.sets.reduce((a,s)=>{if(s.result)a[s.result.ours>s.result.theirs?0:1]++;return a},[0,0])}function validResult(a,b){return Number.isInteger(a)&&Number.isInteger(b)&&Math.min(a,b)>=0&&((Math.max(a,b)===25&&Math.min(a,b)<=23)||(Math.max(a,b)>25&&Math.abs(a-b)===2))}function stats(g,id,all=false){const e=g.events.filter(e=>(all||e.set===displayedSet(g))&&(!id||e.player===id));return {ass:e.filter(e=>e.type==='ass').length,error:e.filter(e=>e.type==='error').length}}
function choices(players,selected,kind){return '<div class="choices">'+players.map(p=>`<label class="choice"><input type="checkbox" data-choice="${kind}" value="${p.id}" ${selected.includes(p.id)?'checked':''}><span><span class="num">#${p.number}</span> ${esc(p.name)}</span></label>`).join('')+'</div>'}
function render(){document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));if(tab==='new')renderNew();if(tab==='live')renderLive();if(tab==='roster')renderRoster();if(tab==='archive')renderArchive()}
function renderNew(){app.innerHTML=`<h2>Bereit für den ersten Service?</h2><div class="muted">Spiel anlegen, Team auswählen und loslegen.</div><form id="newForm" class="panel"><h3>Spiel eröffnen</h3><div class="formgrid"><div><label>Eigenes Team</label><input value="VBC Interlaken" disabled></div><div><label for="opponent">Gegner</label><input id="opponent" name="opponent" required maxlength="80" placeholder="Name des gegnerischen Teams" value="${esc(draft.opponent)}"></div><div><label for="date">Datum</label><input id="date" name="date" type="date" required value="${draft.date}"></div></div><div class="section"><h3>1. Spielkader auswählen</h3>${choices(state.players,draft.kader,'kader')}</div><div class="section"><h3>2. Startaufstellung · Satz 1 <span class="muted">(${draft.start.length}/6)</span></h3>${draft.kader.length?choices(state.players.filter(p=>draft.kader.includes(p.id)),draft.start,'start'):'<p class="muted">Wähle zuerst oben die Spielerinnen für den Spielkader aus.</p>'}</div><div class="section row"><button class="primary" type="submit">Spiel eröffnen →</button><span class="muted">Sechs Startspielerinnen auswählen.</span></div></form><div class="panel"><div class="row between"><h3>Laufende Spiele</h3><button class="small" data-action="backup">Datensicherung</button></div>${state.games.some(g=>!g.closed)?state.games.filter(g=>!g.closed).slice().reverse().map(g=>`<div class="row between" style="padding:14px 0;border-top:1px solid #e8edf3"><div><strong>VBC Interlaken – ${esc(g.opponent)}</strong><div class="muted">${formatDate(g.date)} · ${g.closed?'Abgeschlossen':'Laufend'} · ${g.set} ${g.set===1?'Satz':'Sätze'}</div></div><div class="row"><button data-open="${g.id}">Öffnen</button><button class="small danger" data-archive-running="${g.id}">Abschliessen & archivieren</button></div></div>`).join(''):'<p class="muted">Hier erscheinen laufende Spiele. Abgeschlossene Spiele findest du im Archiv.</p>'}</div>`;document.querySelector('#newForm').onsubmit=e=>{e.preventDefault();if(draft.start.length!==6)return toast('Bitte genau sechs Startspielerinnen auswählen.');if(state.games.some(g=>!g.closed)&&!confirm('Ein weiteres Spiel eröffnen? Dein bisheriges Spiel bleibt gespeichert.'))return;const g={id:uid(),opponent:draft.opponent.trim(),date:draft.date,players:structuredClone(state.players.filter(p=>draft.kader.includes(p.id))),set:1,sets:[{number:1,start:[...draft.start],court:[...draft.start]}],events:[],changes:[],closed:false};if(!g.opponent)return toast('Bitte einen Gegner eingeben.');state.games.push(g);state.active=g.id;viewSet=null;save();tab='live';scope='set';render()};document.querySelector('#opponent').oninput=e=>draft.opponent=e.target.value;document.querySelector('#date').oninput=e=>draft.date=e.target.value}
function formatDate(s){return new Date(s+'T12:00:00').toLocaleDateString('de-CH')}

function activeSet(g=game()){return g?.sets[displayedSet(g)-1]}
function canLearnService(g,s){return !g.closed&&!s.result&&s.number===g.set&&tab==='live'}
function openingScreen(g,s){const waiting=s.opening?.phase==='first-point';app.innerHTML=`<div class="eyebrow" style="color:#3178ac">Satz ${s.number}</div><h2 style="margin-top:8px">VBC Interlaken gegen ${esc(g.opponent)}</h2><section class="panel empty"><h2>${waiting?'Wer macht den ersten Punkt?':'Wer hat den ersten Service?'}</h2><p class="muted">${waiting?esc(g.opponent)+' beginnt mit dem Service.':'Wähle das Team, das diesen Satz mit Service beginnt.'}</p><div class="opening-options"><button class="primary" ${waiting?'data-first-point':'data-first-server'}="ours">${waiting?'Erster Punkt: ':'Erster Service: '}VBC Interlaken</button><button ${waiting?'data-first-point':'data-first-server'}="theirs">${waiting?'Erster Punkt: ':'Erster Service: '}${esc(g.opponent)}</button></div>${waiting?'<button class="small section" data-action="openingBack">← Ersten Service ändern</button>':''}<div class="section"><button class="danger small" data-action="abort">Spiel abbrechen</button></div></section>`}
function setFirstServer(team){const g=game(),s=activeSet(g);if(!canLearnService(g,s)||!['ours','theirs'].includes(team))return;s.opening={firstServer:team,phase:team==='theirs'?'first-point':'ready',firstPoint:null,ours:0,theirs:0};s.possession=team;s.nextServerNeeded=team==='ours';save();render();if(team==='ours')toast('Wähle die erste servierende Spielerin.')}
function setFirstPoint(team){const g=game(),s=activeSet(g);if(!canLearnService(g,s)||s.opening?.phase!=='first-point'||!['ours','theirs'].includes(team))return;s.opening={...s.opening,phase:'ready',firstPoint:team,ours:team==='ours'?1:0,theirs:team==='theirs'?1:0};s.possession=team;s.nextServerNeeded=team==='ours';save();render();toast(team==='ours'?'Erster Punkt VBC · Wähle die servierende Spielerin.':'Erster Punkt '+g.opponent+' gespeichert.')}
function serviceOrder(s){return Array.isArray(s.serviceOrder)?s.serviceOrder:[]}
function servingTeam(s){return s.possession||s.opening?.firstPoint||s.opening?.firstServer||'ours'}
function displayedCourt(s){const order=serviceOrder(s);if(order.length!==6)return [...s.court];const index=Math.max(0,order.indexOf(s.serverSlot)),rotated=[...order.slice(index),...order.slice(0,index)];return [3,2,1,4,5,0].map(i=>s.court[rotated[i]])}
function serviceSnapshot(s){return {possession:servingTeam(s),serverSlot:s.serverSlot??null,nextServerNeeded:!!s.nextServerNeeded,order:[...serviceOrder(s)]}}
function rememberService(s){s.lastServiceEvent=null;s.serviceHistory=s.serviceHistory||[];s.serviceHistory.push(serviceSnapshot(s));if(s.serviceHistory.length>30)s.serviceHistory.shift()}
function opponentServes(){const g=game(),s=activeSet(g);if(!canLearnService(g,s)||servingTeam(s)==='theirs')return;rememberService(s);s.possession='theirs';s.nextServerNeeded=false;save();render()}
function regainService(){const g=game(),s=activeSet(g);if(!canLearnService(g,s)||servingTeam(s)!=='theirs')return;rememberService(s);const order=serviceOrder(s);s.possession='ours';if(order.length===6){const previous=order.indexOf(s.serverSlot);s.serverSlot=order[(previous+1)%6];s.nextServerNeeded=false;save();render();toast('Service VBC · '+player(s.court[s.serverSlot]).name+' ist rechts unten.')}else{s.nextServerNeeded=true;save();render();toast('Wähle die nächste servierende Spielerin.')}}
function undoService(){const g=game(),s=activeSet(g);if(!canLearnService(g,s)||!s.serviceHistory?.length)return;const before=s.serviceHistory.pop();s.lastServiceEvent=null;s.possession=before.possession;s.serverSlot=before.serverSlot;s.nextServerNeeded=before.nextServerNeeded;s.serviceOrder=before.order;save();render();toast('Letzte Service-Auswahl zurückgesetzt.')}

function observeServer(id){const g=game(),s=activeSet(g);if(!canLearnService(g,s))return;const slot=s.court.indexOf(id);if(slot<0)return;if(s.serverSlot!==slot||servingTeam(s)!=='ours'||s.nextServerNeeded)rememberService(s);s.serviceOrder=serviceOrder(s);if(!s.serviceOrder.includes(slot)&&s.serviceOrder.length<6)s.serviceOrder.push(slot);s.serverSlot=slot;s.possession='ours';s.nextServerNeeded=false;save();render()}
function resetServiceOrder(){const g=game(),s=activeSet(g);if(!canLearnService(g,s))return;if(!confirm('Service-Reihenfolge für diesen Satz neu erfassen? Die erfassten Asse und Fehler bleiben gespeichert.'))return;s.serviceOrder=[];s.serverSlot=null;s.serviceHistory=[];s.nextServerNeeded=servingTeam(s)==='ours';save();render();toast('Wähle die Spielerinnen erneut in ihrer Service-Reihenfolge.')}
function serviceInfo(g,s){if(g.closed||s.result)return '';const opening=s.opening,order=serviceOrder(s),ours=servingTeam(s)==='ours',current=Number.isInteger(s.serverSlot)?player(s.court[s.serverSlot]):null;return `<div class="section service-status"><div><strong>${ours?'Service VBC Interlaken':'Service '+esc(g.opponent)}</strong>${ours&&current&&!s.nextServerNeeded?' · '+esc(current.name):''}<div class="muted">${s.nextServerNeeded?'Servierende Spielerin antippen.':order.length===6?'Die Servierende steht bei VBC-Service immer rechts unten.':`Service-Reihenfolge: ${order.length}/6 erkannt · Servierende antippen`}</div>${opening?.firstPoint?`<div class="muted">Erster Punkt: ${opening.firstPoint==='ours'?'VBC Interlaken':esc(g.opponent)} · ${opening.ours}:${opening.theirs}</div>`:''}</div>${s.number===g.set?`<div class="toolbar"><button class="${ours?'':'primary'}" data-action="${ours?'opponentServes':'regainService'}">${ours?'Gegner serviert':'Service zu VBC →'}</button><button class="small" data-action="undoService" ${s.serviceHistory?.length?'':'disabled'}>↶ Servicewechsel</button></div>`:''}</div><details class="service-options"><summary>Service-Einstellungen</summary><div class="toolbar" style="margin-top:10px"><button class="small" data-action="openingEdit">Ersten Service ändern</button><button class="small" data-action="serviceOrderReset">Reihenfolge neu erfassen</button></div></details>`}
function renderLive(){const g=game();if(!g||(g.closed&&tab==='live')){app.innerHTML='<div class="panel empty"><div class="icon">🏐</div><h2>Dein Spiel wartet.</h2><p class="muted">Eröffne ein Spiel und wähle deine sechs Startspielerinnen.</p><button class="primary" data-tab="new">Neues Spiel eröffnen</button></div>';return}const shown=displayedSet(g),sset=g.sets[shown-1];if(canLearnService(g,sset)&&(!sset.opening||sset.opening.phase!=='ready')){openingScreen(g,sset);return}const tally=wins(g),st=stats(g,null,scope==='all'),court=displayedCourt(sset);app.innerHTML=`<div class="row between"><div><div class="eyebrow" style="color:#3178ac">${formatDate(g.date)}</div><h2 style="margin-top:7px">VBC Interlaken <span class="muted">gegen</span> ${esc(g.opponent)}</h2></div><span class="badge">${g.closed?gameStatus(g):'LIVE'} · Sätze ${tally[0]} : ${tally[1]}</span></div><div class="row between section"><div class="toolbar"><label for="viewSet" style="margin:0">Satz</label><select id="viewSet" style="width:90px">${g.sets.map(s=>`<option value="${s.number}" ${s.number===shown?'selected':''}>${s.number}</option>`).join('')}</select><button class="small" data-action="switch" ${g.closed||shown!==g.set?'disabled':''}>Spielerinnenwechsel</button><button class="small" data-action="next" ${g.closed?'disabled':''}>Nächster Satz</button><button class="small" data-action="finish">${g.closed?'Spiel fortsetzen':'Abschliessen & archivieren'}</button></div><button class="small" data-action="undo" ${!g.events.length?'disabled':''}>↶ Letzte Eingabe</button></div>${g.closed?`<p class="muted">${g.aborted?'Dieses Spiel wurde abgebrochen und als «Nicht abgeschlossen» archiviert.':'Das Spiel ist abgeschlossen.'} Für weitere Live-Eingaben kannst du es fortsetzen.</p>`:''}<div class="toolbar section" aria-label="Endstände je Satz">${g.sets.map(s=>`<button class="small ${s.result?'primary':''}" data-result="${s.number}">Endstand Satz ${s.number}${s.result?' · '+s.result.ours+' : '+s.result.theirs:''}</button>`).join('')}</div>${serviceInfo(g,sset)}<div class="cards service-court">${court.map(id=>{const p=player(id),s=stats(g,id);return `<article class="card ${servingTeam(sset)==='ours'&&!sset.nextServerNeeded&&sset.court[sset.serverSlot]===id?'current-server':''}"><button data-focus="${id}" aria-label="Eingabe für ${esc(p.name)} öffnen" style="width:100%;background:white;text-align:left;padding:0;min-height:100px"><div class="cardtop"><div class="jersey">${p.number}</div><div class="name">${esc(p.name)}</div></div></button></article>`}).join('')}</div><details class="panel"><summary style="cursor:pointer;font-weight:700">Auswertung & Korrekturen</summary><section class="panel"><div class="row between"><div class="summary"><div class="metric"><strong style="color:#167453">${st.ass}</strong><span>Team-Asse</span></div><div class="metric"><strong style="color:#b92b38">${st.error}</strong><span>Servicefehler</span></div></div><div class="toolbar"><button class="small ${scope==='set'?'primary':''}" data-scope="set">Satz ${shown}</button><button class="small ${scope==='all'?'primary':''}" data-scope="all">Ganzes Spiel</button></div></div><div class="tablewrap section"><table><thead><tr><th>Spielerin</th>${scope==='all'?g.sets.map(s=>`<th>Satz ${s.number}<br>Ass / Fehler</th>`).join(''):''}<th>Asse</th><th>Fehler</th></tr></thead><tbody>${g.players.map(p=>{const s=stats(g,p.id,scope==='all');return `<tr><td><button data-focus="${p.id}" style="background:transparent;padding:0;text-align:left"><span class="num">#${p.number}</span> ${esc(p.name)} →</button></td>${scope==='all'?g.sets.map(set=>{const e=g.events.filter(e=>e.set===set.number&&e.player===p.id);return `<td>${e.filter(e=>e.type==='ass').length} / ${e.filter(e=>e.type==='error').length}</td>`}).join(''):''}<td>${s.ass}</td><td>${s.error}</td></tr>`}).join('')}</tbody></table></div></section><section class="panel"><div class="row between"><h3>Ereignisse</h3><button class="small" data-action="csv">CSV exportieren</button></div><div class="tablewrap">${g.events.length?`<table><thead><tr><th>Satz</th><th>Spielerin</th><th>Ereignis</th><th>Stand vorher<br>VBC : Gegner</th><th>Korrektur</th></tr></thead><tbody>${g.events.slice().reverse().map(e=>`<tr><td>${e.set}</td><td>#${player(e.player).number} ${esc(player(e.player).name)}</td><td>${e.type==='ass'?'Ass':'Servicefehler'}</td><td>${e.ours!=null?e.ours+' : '+e.theirs:'–'}</td><td><button data-edit="${e.id}">Bearbeiten</button> <button class="danger" data-delete="${e.id}">Löschen</button></td></tr>`).join('')}</tbody></table>`:'<p class="muted">Noch keine Ereignisse. Erfasse das erste Ass oder einen Servicefehler.</p>'}</div></section></details><details class="panel"><summary>Aufstellungen & Wechsel</summary>${g.sets.map(s=>`<p><strong>Satz ${s.number}${s.result?' · '+s.result.ours+' : '+s.result.theirs:''} – Start:</strong> ${s.start.map(id=>esc(player(id).name)).join(', ')} <button class="small" data-result="${s.number}">${s.result?'Endstand ändern':'Endstand eingeben'}</button></p>`).join('')}${g.changes.map(c=>`<p class="muted">Satz ${c.set}: ${esc(player(c.out).name)} → ${esc(player(c.in).name)}${c.ours!=null?' · Stand '+c.ours+' : '+c.theirs:''}</p>`).join('')}</details>`}
function gameStatus(g){return g.closed?(g.aborted?'Nicht abgeschlossen':'Abgeschlossen'):'Laufend'}
function archiveRunning(id){const g=state.games.find(g=>g.id===id&&!g.closed);if(!g)return;const complete=wins(g).some(n=>n>=3);if(!confirm('Spiel gegen '+g.opponent+' abschliessen und ins Archiv stellen?'+(complete?'':' Es wird als Nicht abgeschlossen gespeichert.')+' Alle bisherigen Eingaben bleiben erhalten.'))return;g.closed=true;g.aborted=!complete;g.archivedAt=new Date().toISOString();if(!complete)g.abortedAt=g.archivedAt;else delete g.abortedAt;if(modal.open)close();if(state.active===g.id)state.active=null;archiveView=null;viewSet=null;tab='archive';save();render();toast('Spiel archiviert · '+gameStatus(g)+'.')}
function abortGame(){archiveRunning(state.active)}
function archiveCompleted(){const g=game();if(!g?.closed)return;state.active=null;archiveView=null;viewSet=null;tab='archive'}
function renderArchive(){if(archiveView){const g=state.games.find(g=>g.id===archiveView&&g.closed);if(g){state.active=g.id;renderLive();app.insertAdjacentHTML('afterbegin','<button class="small" data-action="archiveBack" style="margin-bottom:18px">← Zurück zum Archiv</button>');return}archiveView=null}const games=state.games.filter(g=>g.closed).slice().reverse();app.innerHTML=`<h2>Spielarchiv</h2><p class="muted">Abgeschlossene und abgebrochene Spiele · Statistiken abrufen oder Spiele löschen.</p><section class="panel">${games.length?games.map(g=>{const tally=wins(g),st=stats(g,null,true);return `<div class="row between" style="padding:18px 0;border-bottom:1px solid #e8edf3"><div><strong>VBC Interlaken – ${esc(g.opponent)}</strong><div style="margin-top:8px"><span class="badge ${g.aborted?'unfinished':''}">${gameStatus(g)}</span></div><div class="muted" style="margin-top:8px">${formatDate(g.date)} · Sätze ${tally[0]} : ${tally[1]} · ${st.ass} Asse · ${st.error} Fehler</div></div><div class="row"><button class="primary" data-archive="${g.id}">Öffnen</button><button class="danger" data-delete-game="${g.id}">Löschen</button></div></div>`}).join(''):'<div class="empty"><div class="icon">🏐</div><h3>Noch keine archivierten Spiele</h3><p class="muted">Sobald du ein Spiel abschliesst oder abbrichst, erscheint es hier automatisch.</p></div>'}</section>`}
function deleteArchivedGame(id){const g=state.games.find(g=>g.id===id&&g.closed);if(!g)return;if(!confirm('Spiel VBC Interlaken gegen '+g.opponent+' vom '+formatDate(g.date)+' mit allen Statistiken endgültig löschen?'))return;state.games=state.games.filter(g=>g.id!==id);if(state.active===id)state.active=null;if(archiveView===id)archiveView=null;save();render();toast('Spiel aus dem Archiv gelöscht.')}
function renderRoster(){app.innerHTML=`<h2>Dein Team.</h2><p class="muted">${state.players.length} von 16 Plätzen belegt · Zwölf Spielerinnen sind vorgegeben, vier können ergänzt werden.</p><form id="rosterForm" class="panel"><div class="row between"><h3>Spielerinnen & Trikotnummern</h3><button class="primary" type="submit">Kader speichern</button></div><div class="roster">${state.players.map(p=>`<div class="rosteritem"><label for="name-${p.id}">Spielerin</label><div class="row"><input aria-label="Trikotnummer ${esc(p.name)}" name="number-${p.id}" type="number" min="1" max="999" required value="${p.number}"><input id="name-${p.id}" name="name-${p.id}" required maxlength="40" value="${esc(p.name)}"></div></div>`).join('')}${Array.from({length:16-state.players.length},()=>'<div class="rosteritem"><p class="muted">Freier Platz</p><button type="button" data-action="addPlayer">+ Spielerin hinzufügen</button></div>').join('')}</div><p class="muted">Änderungen gelten für neue Spiele. Bereits eröffnete Spiele behalten ihren damaligen Kader.</p></form>`;document.querySelector('#rosterForm').onsubmit=e=>{e.preventDefault();const fd=new FormData(e.target),ps=state.players.map(p=>({...p,number:Number(fd.get('number-'+p.id)),name:String(fd.get('name-'+p.id)).trim()}));if(ps.some(p=>!p.name||!Number.isInteger(p.number)||p.number<1)||new Set(ps.map(p=>p.number)).size!==ps.length)return toast('Bitte Namen und eindeutige Trikotnummern eingeben.');state.players=ps;save();render();toast('Kader gespeichert.')};}
function scoreFields(g,ours=null,theirs=null){return `<div class="score-selector section"><div class="scoregrid">${[['ours','VBC Interlaken',ours],['theirs',g.opponent,theirs]].map(([field,label,value])=>`<div><label for="pick-${field}">${esc(label)}</label><input type="hidden" id="${field}" name="${field}" value="${value??''}"><button id="pick-${field}" type="button" class="score-pick" data-score-toggle="${field}" aria-expanded="false" aria-controls="block-${field}">${value==null?'Punkte wählen ▾':value+' Punkte ▾'}</button></div>`).join('')}</div>${[['ours','VBC Interlaken',ours],['theirs',g.opponent,theirs]].map(([field,label,value])=>`<div id="block-${field}" class="score-block" hidden><div class="muted" style="margin-bottom:10px">${esc(label)} · Punktestand auswählen</div>${[[0,9],[10,19],[20,25]].map(([start,end])=>`<div class="score-row">${Array.from({length:end-start+1},(_,i)=>{const n=start+i;return `<button type="button" class="score-number ${value===n?'selected':''}" data-score-field="${field}" data-score-value="${n}" aria-pressed="${value===n}">${n}</button>`}).join('')}</div>`).join('')}</div>`).join('')}</div>`}
function toggleScoreBlock(field){const target=document.querySelector('#block-'+field),open=target.hidden;for(const f of ['ours','theirs']){document.querySelector('#block-'+f).hidden=true;document.querySelector('#pick-'+f).setAttribute('aria-expanded','false')}target.hidden=!open;document.querySelector('#pick-'+field).setAttribute('aria-expanded',String(open));if(open)target.querySelector('button').focus()}
function chooseScore(field,value){if(!['ours','theirs'].includes(field)||!Number.isInteger(value)||value<0||value>25)return;document.querySelector('#'+field).value=String(value);const pick=document.querySelector('#pick-'+field);pick.textContent=value+' Punkte ▾';pick.setAttribute('aria-expanded','false');const block=document.querySelector('#block-'+field);block.querySelectorAll('[data-score-value]').forEach(b=>{const selected=Number(b.dataset.scoreValue)===value;b.classList.toggle('selected',selected);b.setAttribute('aria-pressed',String(selected))});block.hidden=true;pick.focus()}
function focusPlayer(id){const g=game(),p=player(id),shown=displayedSet(g),s=activeSet(g);if(canLearnService(g,s)&&(!s.opening||s.opening.phase!=='ready')){render();return}observeServer(id);show(`<div class="row"><div class="jersey">${p.number}</div><div><h2>${esc(p.name)}</h2><span class="muted">Satz ${shown}${canLearnService(g,s)&&s.court.includes(id)?' · Als Servierende gewählt':''}</span></div></div><form id="quickForm"><fieldset style="border:0;padding:0;margin:24px 0 0"><legend style="font-weight:700;font-size:14px">Ereignis auswählen</legend><div class="actions section" style="padding:0"><label class="quick-choice good"><input type="radio" name="type" value="ass" required ${g.closed?'disabled':''}><span>ASS +1</span></label><label class="quick-choice danger"><input type="radio" name="type" value="error" required ${g.closed?'disabled':''}><span>FEHLER +1</span></label></div></fieldset><p class="muted">Ass oder Fehler erfassen? Wähle den Spielstand unmittelbar vor dem Service. Ohne Ereignis einfach zurück zum Spiel.</p>${scoreFields(g)}<div class="row section"><button class="primary" type="submit" ${g.closed?'disabled':''}>Speichern & zurück zum Spiel</button><button type="button" data-action="cancel">Zurück zum Spiel</button></div></form>`);document.querySelector('#quickForm').onsubmit=e=>{e.preventDefault();const fd=new FormData(e.target),type=fd.get('type'),ours=Number(fd.get('ours')),theirs=Number(fd.get('theirs'));if(!['ass','error'].includes(type)||fd.get('ours')===''||fd.get('theirs')===''||!Number.isInteger(ours)||!Number.isInteger(theirs)||ours<0||ours>32||theirs<0||theirs>32||g.closed)return toast('Bitte Ereignis und Punktestand für beide Teams auswählen.');const entry={id:uid(),time:new Date().toISOString(),player:id,set:shown,type,ours,theirs};if(canLearnService(g,s)&&s.court.includes(id)){entry.serviceBefore=serviceSnapshot(s);s.possession=type==='error'?'theirs':'ours';s.nextServerNeeded=false;s.lastServiceEvent=entry.id}g.events.push(entry);save();close();render();toast((type==='ass'?'Ass':'Servicefehler')+' · '+p.name+' gespeichert.')};}
function eventDialog(id,existing,type='error'){const g=game(),p=player(id);if(existing)type=existing.type;show(`<h2>${existing?'Eintrag bearbeiten':(type==='ass'?'Ass':'Servicefehler')+' · '+esc(p.name)}</h2><p class="muted">Spielstand unmittelbar <strong>vor dem Service</strong> auswählen.</p><form id="eventForm">${existing?`<div class="formgrid"><div><label>Spielerin</label><select name="player">${g.players.map(p=>`<option value="${p.id}" ${p.id===id?'selected':''}>#${p.number} ${esc(p.name)}</option>`).join('')}</select></div><div><label>Satz</label><select name="set">${g.sets.map(s=>`<option ${s.number===existing.set?'selected':''}>${s.number}</option>`).join('')}</select></div><div><label>Ereignis</label><select name="type"><option value="ass" ${type==='ass'?'selected':''}>Ass</option><option value="error" ${type==='error'?'selected':''}>Servicefehler</option></select></div></div>`:''}${scoreFields(g,existing?.ours,existing?.theirs)}<div class="row section"><button class="primary" type="submit">Speichern</button><button type="button" data-action="cancel">Abbrechen</button></div></form>`);document.querySelector('#eventForm').onsubmit=e=>{e.preventDefault();const fd=new FormData(e.target),data={player:existing?fd.get('player'):id,set:existing?Number(fd.get('set')):displayedSet(g),type:existing?fd.get('type'):type,ours:Number(fd.get('ours')),theirs:Number(fd.get('theirs'))};if(fd.get('ours')===''||fd.get('theirs')===''||data.ours<0||data.ours>32||data.theirs<0||data.theirs>32)return toast('Bitte den Punktestand für beide Teams auswählen.');if(existing)Object.assign(existing,data);else g.events.push({id:uid(),time:new Date().toISOString(),...data});save();close();render();toast(existing?'Eintrag korrigiert.':(data.type==='ass'?'Ass':'Servicefehler')+' gespeichert.')};document.querySelector('#pick-ours').focus()}
function nextSet(setNumber){const g=game(),wasClosed=g.closed;setNumber=setNumber||g.set;const current=g.sets[setNumber-1];show(`<h2>Satz ${setNumber} abschliessen</h2><p class="muted">Mindestens 25 Punkte und zwei Punkte Vorsprung. Beispiele: 25:23, 26:24 oder 28:26.</p><form id="resultForm"><div class="scoregrid section"><div><label>VBC Interlaken · Endstand</label><input name="ours" type="number" min="0" max="999" required value="${current.result?.ours??''}"></div><div><label>${esc(g.opponent)} · Endstand</label><input name="theirs" type="number" min="0" max="999" required value="${current.result?.theirs??''}"></div></div><div class="row section"><button class="primary">Satz speichern</button><button type="button" data-action="cancel">Abbrechen</button></div></form>`);document.querySelector('#resultForm').onsubmit=e=>{e.preventDefault();const fd=new FormData(e.target),ours=Number(fd.get('ours')),theirs=Number(fd.get('theirs'));if(!validResult(ours,theirs))return toast('Mindestens 25 Punkte und zwei Punkte Abstand erforderlich.');current.result={ours,theirs};if(wasClosed){save();close();render();return}const tally=wins(g);if(tally.some(n=>n>=3)){g.closed=true;g.aborted=false;archiveCompleted();save();close();render();toast('Spiel beendet · '+tally[0]+' : '+tally[1]);return}if(setNumber!==g.set){g.closed=false;save();close();render();return}if(g.set>=5){save();close();render();return toast('Bitte die vorherigen Satzergebnisse prüfen.')}g.closed=false;save();startNextSet()}}
function startNextSet(){const g=game();show(`<h2>Startaufstellung · Satz ${g.set+1}</h2><p class="muted">Wähle genau sechs Spielerinnen.</p><form id="setForm">${choices(g.players,g.sets[g.set-1].court,'next')}<div class="row section"><button class="primary">Nächsten Satz starten</button><button type="button" data-action="cancel">Später starten</button></div></form>`);document.querySelector('#setForm').onsubmit=e=>{e.preventDefault();const ids=[...e.target.querySelectorAll('input:checked')].map(i=>i.value);if(ids.length!==6)return toast('Bitte genau sechs Spielerinnen auswählen.');g.set++;g.sets.push({number:g.set,start:[...ids],court:[...ids]});viewSet=null;scope='set';save();close();render()}}
function switchPlayer(){const g=game(),court=g.sets[g.set-1].court,bench=g.players.filter(p=>!court.includes(p.id));if(!bench.length)return toast('Keine weitere Spielerin im Spielkader.');show(`<h2>Spielerinnenwechsel</h2><form id="switchForm"><label>Verlässt das Feld</label><select name="out">${court.map(id=>`<option value="${id}">#${player(id).number} ${esc(player(id).name)}</option>`).join('')}</select><label class="section">Kommt aufs Feld</label><select name="in">${bench.map(p=>`<option value="${p.id}">#${p.number} ${esc(p.name)}</option>`).join('')}</select><p class="muted">Spielstand zum Zeitpunkt des Wechsels.</p>${scoreFields(g)}<div class="row section"><button class="primary">Wechsel speichern</button><button type="button" data-action="cancel">Abbrechen</button></div></form>`);document.querySelector('#switchForm').onsubmit=e=>{e.preventDefault();const fd=new FormData(e.target),out=fd.get('out'),inside=fd.get('in'),ours=Number(fd.get('ours')),theirs=Number(fd.get('theirs'));if(fd.get('ours')===''||fd.get('theirs')==='')return toast('Bitte den Punktestand für beide Teams auswählen.');court[court.indexOf(out)]=inside;g.changes.push({set:g.set,out,in:inside,ours,theirs,time:new Date().toISOString()});save();close();render();toast('Spielerinnenwechsel gespeichert.')}}
function addPlayer(){if(state.players.length>=16)return;show('<h2>Spielerin hinzufügen</h2><form id="addForm"><label>Name</label><input name="name" maxlength="40" required><label class="section">Trikotnummer</label><input name="number" type="number" min="1" max="999" required><div class="row section"><button class="primary">Hinzufügen</button><button type="button" data-action="cancel">Abbrechen</button></div></form>');document.querySelector('#addForm').onsubmit=e=>{e.preventDefault();const fd=new FormData(e.target),name=String(fd.get('name')).trim(),number=Number(fd.get('number'));if(!name)return;if(state.players.some(p=>p.number===number))return toast('Diese Trikotnummer ist bereits vergeben.');const id=uid();state.players.push({id,name,number});save();close();render()}}
function download(name,text,type){const a=document.createElement('a'),url=URL.createObjectURL(new Blob([text],{type}));a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}function csv(){const g=game(),rows=[['Team','Gegner','Datum','Satz','Nummer','Spielerin','Ereignis','VBC vor Service','Gegner vor Service'],...g.events.map(e=>['VBC Interlaken',g.opponent,g.date,e.set,player(e.player).number,player(e.player).name,e.type==='ass'?'Ass':'Servicefehler',e.ours??'',e.theirs??'']),[],['Statistik je Satz','Nummer','Spielerin','Satz','Asse','Servicefehler'],...g.sets.flatMap(s=>g.players.map(p=>{const es=g.events.filter(e=>e.set===s.number&&e.player===p.id);return ['Statistik',p.number,p.name,s.number,es.filter(e=>e.type==='ass').length,es.filter(e=>e.type==='error').length]})),[],['Gesamtauswertung','Nummer','Spielerin','Asse','Servicefehler'],...g.players.map(p=>{const s=stats(g,p.id,true);return ['Gesamt',p.number,p.name,s.ass,s.error]}),['Team gesamt','','',stats(g,null,true).ass,stats(g,null,true).error],[],['Satzergebnisse','Satz','VBC','Gegner'],...g.sets.map(s=>['Satz',s.number,s.result?.ours??'',s.result?.theirs??'']),[],['Spielerinnenwechsel','Satz','Ausgewechselt','Eingewechselt','VBC beim Wechsel','Gegner beim Wechsel'],...g.changes.map(c=>['Wechsel',c.set,player(c.out).name,player(c.in).name,c.ours??'',c.theirs??'']),[],['Spielstatus',gameStatus(g)]];download('VBC-Service-'+g.date+'.csv','\uFEFF'+rows.map(r=>r.map(c=>'"'+String(c).replaceAll('"','""')+'"').join(';')).join('\r\n'),'text/csv;charset=utf-8')}
document.addEventListener('change',e=>{if(e.target.id==='viewSet'){viewSet=Number(e.target.value);render();return}const kind=e.target.dataset.choice;if(!['kader','start'].includes(kind))return;const id=e.target.value,key=kind==='kader'?'kader':'start';if(e.target.checked){if(key==='start'&&draft.start.length>=6){e.target.checked=false;return toast('Die Startaufstellung hat bereits sechs Spielerinnen.')}draft[key].push(id)}else{draft[key]=draft[key].filter(x=>x!==id);if(key==='kader')draft.start=draft.start.filter(x=>x!==id)}render()});document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;if(b.dataset.firstServer){setFirstServer(b.dataset.firstServer);return}if(b.dataset.firstPoint){setFirstPoint(b.dataset.firstPoint);return}if(b.dataset.scoreToggle){toggleScoreBlock(b.dataset.scoreToggle);return}if(b.dataset.scoreField){chooseScore(b.dataset.scoreField,Number(b.dataset.scoreValue));return}if(b.dataset.tab){tab=b.dataset.tab;archiveView=null;if(tab==='live'&&game()?.closed){state.active=state.games.find(g=>!g.closed)?.id||null}render();return}if(b.dataset.archive){archiveView=b.dataset.archive;state.active=b.dataset.archive;tab='archive';viewSet=null;scope='all';render();return}if(b.dataset.archiveRunning){archiveRunning(b.dataset.archiveRunning);return}if(b.dataset.deleteGame){deleteArchivedGame(b.dataset.deleteGame);return}if(b.dataset.open){state.active=b.dataset.open;viewSet=null;tab='live';scope='set';save();render();return}const g=game();if(b.dataset.result){nextSet(Number(b.dataset.result));return}if(b.dataset.focus){focusPlayer(b.dataset.focus);return}if(b.dataset.recordAss){close();eventDialog(b.dataset.recordAss,null,'ass');return}if(b.dataset.recordError){close();eventDialog(b.dataset.recordError,null,'error');return}if(b.dataset.ass){if(g.closed)return;g.events.push({id:uid(),set:g.set,player:b.dataset.ass,type:'ass',ours:null,theirs:null,time:new Date().toISOString()});save();render();toast('Ass · '+player(b.dataset.ass).name);return}if(b.dataset.error){if(!g.closed)eventDialog(b.dataset.error);return}if(b.dataset.edit){const entry=g.events.find(x=>x.id===b.dataset.edit);if(modal.open)close();eventDialog(entry.player,entry);return}if(b.dataset.delete){if(confirm('Diesen Eintrag löschen?')){g.events=g.events.filter(x=>x.id!==b.dataset.delete);save();if(modal.open)close();render()}return}if(b.dataset.scope){scope=b.dataset.scope;render();return}switch(b.dataset.action){case'cancel':close();break;case'abort':abortGame();break;case'opponentServes':opponentServes();break;case'regainService':regainService();break;case'undoService':undoService();break;case'openingBack':activeSet(g).opening=null;save();render();break;case'openingEdit':if(confirm('Ersten Service für diesen Satz neu wählen? Die Service-Reihenfolge und Statistik bleiben erhalten.')){activeSet(g).opening=null;save();render()}break;case'serviceOrderReset':resetServiceOrder();break;case'archiveBack':archiveView=null;render();break;case'next':if(g.sets[g.set-1].result&&!wins(g).some(n=>n>=3))startNextSet();else nextSet();break;case'switch':switchPlayer();break;case'addPlayer':addPlayer();break;case'undo':if(g.events.length&&confirm('Letztes Ereignis rückgängig machen?')){const removed=g.events.pop(),rs=g.sets[removed.set-1];if(removed.serviceBefore&&rs.lastServiceEvent===removed.id){const old=removed.serviceBefore;rs.possession=old.possession;rs.serverSlot=old.serverSlot;rs.nextServerNeeded=old.nextServerNeeded;rs.lastServiceEvent=null}save();render();toast('Letzte Eingabe entfernt.')}break;case'finish':if(!g.closed){archiveRunning(g.id);break}if(confirm('Spiel fortsetzen?')){if(wins(g).some(n=>n>=3))g.sets[g.set-1].result=null;g.closed=false;g.aborted=false;delete g.abortedAt;delete g.archivedAt;tab='live';archiveView=null;save();render()}break;case'csv':csv();break;case'backup':download('VBC-Service-Datensicherung.json',JSON.stringify(state,null,2),'application/json');break}});render();
</script></body></html>
